[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party crates taken in to patch: not ours to lint (see each UPSTREAM.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/hivepaas/shellwing"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
shellwing-term = { path = "crates/term" }
shellwing-ssh = { path = "crates/ssh" }
shellwing-config = { path = "crates/config" }
shellwing-vault = { path = "crates/vault" }
shellwing-core = { path = "crates/core" }
shellwing-remote = { path = "crates/remote" }
shellwing-presence = { path = "crates/presence" }
shellwing-i18n = { path = "crates/i18n" }
shellwing-update = { path = "crates/update" }
shellwing-spawn = { path = "crates/spawn" }
shellwing-import = { path = "crates/import" }
# GPUI as published by Longbridge (the same snapshot tern and gpui-kit use).
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit and runtime_shaders only affect macOS; the Linux backends are app features.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
# HivePaaS's fork of uzaaft/libghostty-rs, pinned to Ghostty 1.4.0 and its
# security fixes (upstream's master pins a commit before them). Needs Zig 0.17.
# Back to upstream once it pins 1.4.0 or later.
libghostty-vt = { git = "https://github.com/hivepaas/libghostty-rs", branch = "ghostty-1.4.0" }
# ring rather than the default aws-lc-rs: it builds on Windows without NASM or CMake.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-channel = "2"
anyhow = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Dependencies optimised in dev builds too, so the terminal is usable while developing.
[profile.dev.package."*"]
opt-level = 2

# The UI tests on CI (`--profile ui-tests`): release speed, as debug builds of
# libghostty parse too slowly (its Zig build follows DEBUG and OPT_LEVEL, not
# this), with debug assertions: GPUI records where elements are drawn only
# with them, so the tests could not click without, and they catch what only a
# debug build would.
[profile.ui-tests]
inherits = "release"
debug-assertions = true

# GPUI's Linux platform, taken in for a fix (vendor/gpui-pre-linux/UPSTREAM.md).
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
