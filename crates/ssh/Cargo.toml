[package]
name = "shellwing-ssh"
description = "SSH sessions over russh, with OpenSSH-compatible host key checking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
russh.workspace = true
tokio = { workspace = true, features = ["io-util", "fs"] }
thiserror.workspace = true
ssh2-config = "0.8"
russh-sftp = "3"
# Randomness for new keys and for locking exported ones.
rand = { version = "0.10", features = ["thread_rng"] }
zeroize = "1"
# Hashed names in known_hosts (HMAC-SHA1, base64), as russh reads them.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs"] }

[lints]
workspace = true
