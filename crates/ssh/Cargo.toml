[package]
name = "shellwing-ssh"
description = "SSH sessions over russh, with OpenSSH-compatible host key checking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
russh.workspace = true
tokio = { workspace = true, features = ["io-util", "fs"] }
thiserror.workspace = true
ssh2-config = "0.8"
russh-sftp = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs"] }
rand = { version = "0.10", features = ["thread_rng"] }

[lints]
workspace = true
