[package]
name = "shellwing-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The app's UI tests point the updater at a list and keys of their own
# (set_test_source); a build without it reads only LIST_URL and the keys
# built in.
test-source = []

[dependencies]
shellwing-spawn.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# Ed25519ctx, verified by hand on the curve (ed25519-dalek has Ed25519ph only).
curve25519-dalek = "5"
# ML-DSA-65 (FIPS 204), with its context string.
fips204 = "0.4"
thiserror.workspace = true
# Reading the list: reqwest on rustls with ring, as crates/remote has them.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# A macOS release is Shellwing.app, tarred and gzipped.
flate2 = "1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true

