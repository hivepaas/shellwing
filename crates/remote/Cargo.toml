[package]
name = "shellwing-remote"
description = "Sync backends over the network (WebDAV, S3-compatible) for the vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shellwing-spawn.workspace = true
shellwing-vault.workspace = true
opendal = { version = "0.59", default-features = false, features = [
    "services-s3",
    "services-webdav",
    "blocking",
    # rustls with ring, as russh has it; not aws-lc, a C library to build.
    "http-transport-reqwest-rustls-no-provider",
    "executors-tokio",
    "layers-retry",
    "layers-timeout",
] }
tokio = { workspace = true }
opendal-http-transport-reqwest = { version = "0.59", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# A token for Git over HTTPS, as a Basic header.
base64 = "0.22"
# The clone of a Git repository lives in the cache folder.
dirs = "7"
# WebDAV's conditional writes, which OpenDAL leaves out; the client it uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

# Git without a `git` to run (a phone): libgit2, HTTPS through the
# system's TLS on Apple's platforms.
git2 = { version = "0.20", default-features = false, features = ["https"], optional = true }

[features]
# Sync through Git with libgit2 instead of the system's git (iOS).
libgit = ["dep:git2"]
# For a target with no OpenSSL to find (iOS): git2's `https` asks for
# openssl-sys on every Unix, though libgit2 uses the system's TLS on
# Apple's; built from source there, and never called.
libgit-vendored = ["libgit", "git2/vendored-openssl"]

[dev-dependencies]
opendal = { version = "0.59", default-features = false, features = ["services-memory", "blocking", "executors-tokio"] }
# A WebDAV server in the tests, in memory.
dav-server = { version = "0.11", default-features = false, features = ["memfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# An S3 server in the tests, over a temporary folder.
s3s = "0.17"
s3s-fs = "0.17"

[lints]
workspace = true
