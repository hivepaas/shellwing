[package]
name = "shellwing"
description = "Native SSH client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "shellwing"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
# Linux window system backends. Build with `--no-default-features --features wayland`
# when the X11 development libraries are not installed.
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
shellwing-term.workspace = true
shellwing-ssh.workspace = true
shellwing-config.workspace = true
shellwing-vault.workspace = true
shellwing-core.workspace = true
shellwing-remote.workspace = true
shellwing-i18n.workspace = true
# Values of environments, wiped from memory when dropped.
zeroize = "1"
sha2 = "0.10"
# The snippet library's items (src/library/items.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What a link may open (its syntax module only; pinned with the notes' editor).
zorite-markdown = { version = "=0.10.0", default-features = false }
# The notes' editor: zorite-editor, taken in (crates/note-editor/UPSTREAM.md).
shellwing-note-editor = { path = "../note-editor" }
gpui.workspace = true
# Only to hand GPUI a rendered gradient; the same version GPUI uses.
image = { version = "0.25", default-features = false }
gpui_platform.workspace = true
tokio.workspace = true
async-channel.workspace = true
anyhow.workspace = true
unicode-segmentation = "1"
# Where downloads go, and file dates in local time.
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# To write `--help` and errors to the terminal the app was started from: a GUI
# program on Windows has no console of its own (see main.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Puts the icon and the version into shellwing.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: one Win32 call (AttachConsole, in main.rs) allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
