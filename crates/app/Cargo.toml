[package]
name = "shellwing"
description = "Native SSH client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "shellwing"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
# Linux window system backends. Build with `--no-default-features --features wayland`
# when the X11 development libraries are not installed.
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
shellwing-term.workspace = true
shellwing-ssh.workspace = true
shellwing-config.workspace = true
shellwing-vault.workspace = true
gpui.workspace = true
# Only to hand GPUI a rendered gradient; the same version GPUI uses.
image = { version = "0.25", default-features = false }
gpui_platform.workspace = true
tokio.workspace = true
async-channel.workspace = true
anyhow.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
toml = "1"
russh.workspace = true

[lints]
workspace = true
