[package]
name = "shellwing-core"
description = "Sessions without a UI: connecting, prompts, saved secrets, host targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shellwing-term.workspace = true
shellwing-ssh.workspace = true
shellwing-config.workspace = true
shellwing-vault.workspace = true
shellwing-presence.workspace = true
# Syncing the vault: its places (WebDAV, S3, Git) and what it says.
shellwing-remote.workspace = true
shellwing-i18n.workspace = true
# Snippets, environments, config files and the snippet library (the phone
# apps share them with the desktop).
sha2 = "0.10"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio.workspace = true
async-channel.workspace = true
anyhow.workspace = true
# Local terminals: a PTY on Unix, ConPTY on Windows.
portable-pty = "0.9"
# Session logs: their folder, and the time in their names and lines.
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Images for notes: read, scaled and written again (images.rs). GPUI takes in
# the same crate with these formats and more, so the app grows by nothing.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
russh.workspace = true

[lints]
workspace = true
