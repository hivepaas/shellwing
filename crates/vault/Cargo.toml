[package]
name = "shellwing-vault"
description = "Encrypted secrets (passwords, key passphrases) unlocked through the OS keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
# The account key kept by a passphrase, where no keychain keeps it.
argon2 = "0.6"
# How guessable a passphrase that opens the synced vault is.
zxcvbn = "3"
base64 = "0.22"
sha2 = "0.10"
chacha20poly1305 = "0.10"
# Pairing a new device: a key agreed through the sync folder.
curve25519-dalek = "5"
hkdf = "0.12"
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
zeroize = "1"

# The keyring crate picks no store on iOS or Android: apps there supply their own
# KeyStore (the platform keychain, through the app).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
keyring = "4"

[lints]
workspace = true
