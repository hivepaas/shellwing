name: Release

# A tag vX.Y.Z (or vX.Y.Z-betaN) builds shellwing for every platform, packages
# it (scripts/package_*.sh) and makes a draft release on GitHub with the files
# and their SHA-256. Nothing reaches users until the draft is published and the
# signed list of releases moves (docs/releasing.md).
#
# A pull request that changes the packaging, or a run by hand (Actions >
# Release > Run workflow), builds and packages the branch the same way and
# keeps the files as the run's artifacts: a rehearsal, with no release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/package_*.sh
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the workspace's version, or the release would tell its users
      # of an update to itself.
      - name: The tag and Cargo.toml agree
        id: v
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest Ubuntu GitHub has: the glibc it links is the
          # oldest the packages run on (2.35: Ubuntu 22.04, Debian 12).
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # Whether the repository holds a Developer ID (not the secret itself).
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 'Linux packages (GPUI: Wayland, X11, Vulkan, fonts)'
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev dpkg-dev

      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      # libghostty-vt is built from source with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked -p shellwing

      # A Developer ID for macOS, when the repository has one (docs/releasing.md):
      # a keychain of this run's own, and the profile and the notary's key in
      # files the packaging script is told of. Without it, signed ad hoc.
      - name: Signing keys (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Apple's intermediate, should the runner lack it: the chain must build.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$MACOS_PROVISIONING_PROFILE" ]; then
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/shellwing.provisionprofile"
            echo "MACOS_PROVISIONING_PROFILE=$RUNNER_TEMP/shellwing.provisionprofile" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/package_${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}.sh

      - name: Forget the signing keys (macOS)
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/shellwing.provisionprofile"

      - uses: actions/upload-artifact@v4
        with:
          name: shellwing-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: [version, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The release's notes are docs/releases/vX.Y.Z.md; a draft, published by
      # hand once it is checked.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::no $notes"; exit 1; }
          prerelease=()
          case "$TAG" in *-beta*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --draft "${prerelease[@]}" \
            --title "shellwing $VERSION" --notes-file "$notes" --verify-tag
