name: UI tests

# The UI scenarios (crates/app/src/ui_tests): the real workspace in GPUI's
# test window, driven by keystrokes against an SSH server in the test process.
# They take longer than CI's tests, so they run daily and when started by hand
# (Actions > UI tests > Run workflow), not on pushes or pull requests.

on:
  schedule:
    # 02:00 in Vietnam.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run on
        type: choice
        options: [all, linux, macos, windows]
        default: all
      filter:
        description: Only scenarios whose path contains this (e.g. "connect::" or "sftp")
        type: string
        default: ""

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: ui-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || inputs.platforms == 'all') && '["linux-x86_64","macos-arm64","windows-x86_64"]' ||
          inputs.platforms == 'macos' && '["macos-arm64"]' ||
          inputs.platforms == 'windows' && '["windows-x86_64"]' ||
          '["linux-x86_64"]') }}
    runs-on: >-
      ${{ startsWith(matrix.name, 'macos') && 'macos-latest' ||
      startsWith(matrix.name, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; sftp-server)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev \
            openssh-sftp-server   # the SFTP scenarios talk to OpenSSH's sftp-server

      # libghostty-vt is built from source with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-${{ matrix.name }}

      # Zig fetches libghostty's own dependencies while building it: a network
      # hiccup there (codeberg.org's DNS, once) should not fail the run. What
      # it fetched stays in Zig's cache for the builds after this one.
      - name: Build libghostty (up to three tries)
        shell: bash
        run: |
          for try in 1 2 3; do
            cargo check -p libghostty-vt-sys && exit 0
            echo "::warning::building libghostty failed (try $try)"
            sleep 30
          done
          exit 1

      - name: Clippy (with the UI tests)
        run: cargo clippy -p shellwing --features ui-tests --all-targets -- -D warnings

      # The ui-tests profile (Cargo.toml): release speed, as debug builds of
      # libghostty parse too slowly for the flood scenario on CI machines, with
      # debug assertions, which the clicking scenarios need.
      - name: UI scenarios
        shell: bash
        run: cargo test --profile ui-tests -p shellwing --features ui-tests "ui_tests::${{ inputs.filter }}"
