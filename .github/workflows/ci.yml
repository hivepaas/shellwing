name: CI

on:
  push:
    branches: [main]
  # Only pull requests into main: stacked PRs on top of other branches are
  # checked locally and get CI once they are retargeted to main.
  pull_request:
    branches: [main]
  # macOS and Windows minutes cost more, so they run only when started by hand
  # (Actions > CI > Run workflow); pushes and pull requests build Linux (and
  # the core for Android, on Linux) only.
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [all, macos, windows, linux, android, ios]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    # Started by hand for the phones only: the desktop builds sit it out.
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["android","ios"]'), inputs.platforms)
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(
          inputs.platforms == 'all' && '["linux-x86_64","macos-arm64","windows-x86_64"]' ||
          inputs.platforms == 'macos' && '["macos-arm64"]' ||
          inputs.platforms == 'windows' && '["windows-x86_64"]' ||
          '["linux-x86_64"]') }}
    runs-on: >-
      ${{ startsWith(matrix.name, 'macos') && 'macos-latest' ||
      startsWith(matrix.name, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; PAM; sftp-server)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev libdbus-1-dev libzstd-dev libpam0g-dev \
            openssh-sftp-server   # the SFTP tests talk to OpenSSH's sftp-server

      # libghostty-vt is built from source with Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      - uses: ./.github/actions/fetch-ghostty

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The translations follow the code's English (crates/i18n/locales).
      - name: Translations
        if: runner.os == 'Linux'
        run: python3 scripts/i18n.py check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release: dev builds compile libghostty in Zig's Debug mode, too slow for the flood test.
      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release -p shellwing

      - uses: actions/upload-artifact@v4
        with:
          name: shellwing-${{ matrix.name }}
          path: target/release/shellwing${{ startsWith(matrix.name, 'windows') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14

  # The UI-free core (term, ssh, config, vault) and the phone apps' bindings
  # (crates/mobile), built, not run. Android cross-builds on Linux with the
  # runner's NDK; iOS needs Xcode, so it runs only when started by hand, and
  # builds the iPhone app (ios/) too.
  android:
    name: android-aarch64 (core, bindings)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","android"]'), inputs.platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: ./.github/actions/fetch-ghostty

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Clippy (core, Android)
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_HOME="$ndk"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          # OpenSSL, built for libgit2 (crates/mobile), runs ranlib.
          export RANLIB_aarch64_linux_android="$bin/llvm-ranlib"
          cargo clippy -p shellwing-core -p shellwing-mobile --target aarch64-linux-android -- -D warnings

  # The Android app (android/): the Rust library for phones and the emulator,
  # its Kotlin, and a debug APK. Long, so only when started by hand.
  android-app:
    name: android (app)
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","android"]'), inputs.platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: ./.github/actions/fetch-ghostty

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Rust library and Kotlin
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo install cargo-ndk --locked
          scripts/build_android.sh --debug

      - name: APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: shellwing-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios-sim-arm64 (app)
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","ios"]'), inputs.platforms)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: ./.github/actions/fetch-ghostty

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim-arm64

      - name: Clippy (core and the app's bindings, iOS Simulator)
        run: cargo clippy -p shellwing-core -p shellwing-mobile --target aarch64-apple-ios-sim -- -D warnings

      # The app itself, for the Simulator, unsigned: what it links and the
      # Swift UniFFI generates, then the SwiftUI around them.
      - name: Build the iOS app
        run: |
          brew install xcodegen
          scripts/build_ios.sh --debug
          (cd ios && xcodegen generate --quiet)
          xcodebuild -project ios/Shellwing.xcodeproj -scheme Shellwing \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath target/ios \
            CODE_SIGNING_ALLOWED=NO build

  releasesign:
    name: releasesign (Go)
    # The release signing tool: with the Linux build, wherever that runs.
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","linux"]'), inputs.platforms)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/releasesign
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/releasesign/go.mod

      - name: Vet and test
        run: |
          go vet .
          go test .
          # One file, the standard library only: as scripts/release_sign.sh builds it.
          cp main.go "$RUNNER_TEMP/main.go"
          cd "$RUNNER_TEMP" && env GOFLAGS= GOWORK=off GOPROXY=off go build -o releasesign main.go
