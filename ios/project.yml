# The iOS app's Xcode project, made by XcodeGen (`make ios`): edit this, not
# the .xcodeproj, which is generated and not committed.
name: Shellwing
options:
  bundleIdPrefix: com.hivepaas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6KW3D6ZGQJ
    CODE_SIGN_STYLE: Automatic
targets:
  Shellwing:
    type: application
    platform: iOS
    sources:
      - path: Shellwing
      # Generated by scripts/build_ios.sh, from crates/mobile.
      - path: Generated/shellwing_mobile.swift
    dependencies:
      - framework: Generated/ShellwingCore.xcframework
        embed: false
    info:
      path: Shellwing/Info.plist
      properties:
        CFBundleDisplayName: shellwing
        # The languages of crates/i18n: iOS offers them in the app's settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, es, fr, pt-BR, vi, ru, ja, ko, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSFaceIDUsageDescription: shellwing asks that it is you before it shows itself, when you set it to lock, and before it shows a secret, such as an environment's values.
        NSLocalNetworkUsageDescription: shellwing connects to servers on your network over SSH.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hivepaas.shellwing
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust library is built for Apple silicon's Simulator only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # What the Rust library needs from the system.
        OTHER_LDFLAGS: ["-lc++", "-lz", "-liconv", "-framework", "Security", "-framework", "SystemConfiguration"]
